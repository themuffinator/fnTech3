name: release

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FNQL_LINUX_GLIBC_MAX: "2.31"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed release tag (for example v0.1.0). Creates or repairs a draft prerelease.
        required: true
        default: v0.1.0
        type: string

# Never cancel an upload in progress. Push validation cannot cancel a release.
concurrency:
  group: fntech3-${{ github.event_name }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      head_commit: ${{ steps.meta.outputs.head_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p .tmp/release-workflow
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/release_workflow.py metadata --tag "$RELEASE_TAG" --github-output > .tmp/release-workflow/metadata
            SOURCE_COMMIT=$(sed -n 's/^head_commit=//p' .tmp/release-workflow/metadata)
            git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
            cat .tmp/release-workflow/metadata >> "$GITHUB_OUTPUT"
          else
            python scripts/release_workflow.py metadata --github-output >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize
        run: |
          echo 'Version: ${{ steps.meta.outputs.version }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source commit: ${{ steps.meta.outputs.head_commit }}' >> "$GITHUB_STEP_SUMMARY"

  windows-msys32:
    needs: [prepare]
    name: Build Windows-MSYS2 x86
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Select native Windows Python for build scripts and tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp/release-workflow | Out-Null
          $releasePython = (Get-Command python).Source.Replace('\', '/')
          @('[binaries]', "python3 = '$releasePython'", "python = '$releasePython'") |
            Set-Content -Encoding utf8 .tmp/release-workflow/python-native.ini

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: git
          pacboy: >-
            toolchain:p
            meson:p
            ninja:p

      - name: Build
        shell: msys2 {0}
        run: |
          mkdir -p bin
          meson setup meson/build-x86 \
            --native-file .tmp/release-workflow/python-native.ini \
            --buildtype=release \
            --wrap-mode=forcefallback \
            --prefix "$PWD/bin" \
            -Dc_link_args=-static \
            -Dcpp_link_args=-static \
            -Dcurl=enabled \
            -Dcurl-dlopen=false \
            -Dsdl=disabled \
            -Drenderer-dlopen=true \
            -Drenderers=glx,vk,rtx \
            -Drenderer-default=glx \
            -Daudio-tests=true \
            -Dglx-tests=true \
            -Dzlib:default_library=static \
            -Dlibjpeg-turbo:simd=disabled
          meson compile -C meson/build-x86
          meson install -C meson/build-x86 --no-rebuild --skip-subprojects

      - name: Run complete regression suite
        shell: msys2 {0}
        run: meson test -C meson/build-x86 --print-errorlogs --max-lines 10000

      - name: Check Windows runtime dependencies
        run: python scripts/check_windows_runtime_deps.py --require-pe bin

      - name: Verify release layout
        run: python scripts/verify_release_layout.py bin/fntech3-pkg.fnz

      - uses: actions/upload-artifact@v7
        with:
          name: windows-mingw-x86
          path: bin
          if-no-files-found: error
          retention-days: 5

  windows-msvc:
    needs: [prepare]
    name: Build Windows-MSVC x86
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: microsoft/setup-msbuild@v3

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head_commit }}
          submodules: recursive
          persist-credentials: false

      - name: Install Meson
        run: python -m pip install meson ninja

      - name: Build
        shell: cmd
        run: |
          if not exist bin mkdir bin

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64 || exit /b
          meson setup meson\build-x86 --buildtype=release --wrap-mode=forcefallback --prefix "%CD%\bin" -Db_vscrt=static_from_buildtype -Dzlib:default_library=static -Dcurl=enabled -Dcurl-dlopen=false -Dsdl=disabled -Drenderer-dlopen=true -Drenderers=glx,vk,rtx -Drenderer-default=glx -Daudio-tests=true -Dglx-tests=true -Dlibjpeg-turbo:simd=disabled || exit /b
          meson compile -C meson\build-x86 || exit /b
          meson install -C meson\build-x86 --no-rebuild --skip-subprojects || exit /b

      - name: Run complete regression suite
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64 || exit /b
          meson test -C meson\build-x86 --print-errorlogs --max-lines 10000 || exit /b

      - name: Check Windows runtime dependencies
        run: python scripts/check_windows_runtime_deps.py --require-pe bin

      - name: Verify release layout
        run: python scripts/verify_release_layout.py bin/fntech3-pkg.fnz

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-x86
          path: bin
          if-no-files-found: error
          retention-days: 5

  source-validation:
    needs: [prepare]
    name: Release source validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install source regression runner
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -qq update
          sudo apt-get install -y gcc-multilib g++-multilib libgl-dev:i386 libx11-dev:i386
          python -m pip install pytest==8.4.1

      - name: Validate version, changelog and generated docs
        run: python scripts/release_workflow.py check

      - name: Run complete source regression suite
        run: python -m pytest

  linux-x86-regression:
    needs: [prepare]
    name: Run Linux i686 Meson regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head_commit }}
          persist-credentials: false

      - name: Install i686 Meson build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -qq update
          sudo apt-get install -y \
            file \
            gcc-multilib \
            g++-multilib \
            glslang-tools \
            libasound2-dev:i386 \
            libc6-dev-i386 \
            libgl-dev:i386 \
            libx11-dev:i386 \
            libxext-dev:i386 \
            libxrandr-dev:i386 \
            libxxf86dga-dev:i386 \
            libxxf86vm-dev:i386 \
            linux-libc-dev:i386 \
            mesa-common-dev:i386 \
            meson \
            ninja-build \
            pkg-config \
            python3

      - name: Build Linux i686 regression targets
        run: |
          meson setup .tmp/meson-linux-release-tests \
            --cross-file misc/meson/linux-x86.ini \
            --buildtype=release \
            -Daudio-tests=true \
            -Dbuild-client=true \
            -Dbuild-server=false \
            -Dcurl=disabled \
            -Dglx-tests=true \
            -Dogg-vorbis=false \
            -Drenderer-dlopen=true \
            -Drenderer-default=glx \
            -Drenderers=glx,vk,rtx \
            -Dsdl=disabled
          meson compile -C .tmp/meson-linux-release-tests

      - name: Run complete Linux i686 regression suite
        run: meson test -C .tmp/meson-linux-release-tests --print-errorlogs

  ubuntu-x86:
    needs: [prepare]
    name: Build Ubuntu x86
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install tools
        run: |
          dpkg --add-architecture i386
          apt-get -qq update
          apt-get -y install git make python3 python3-pip binutils pkg-config gcc-multilib g++-multilib zlib1g-dev:i386 libfreetype6-dev:i386 libcurl4-openssl-dev:i386 libjpeg-dev:i386 libogg-dev:i386 libvorbis-dev:i386 mesa-common-dev:i386 libxxf86dga-dev:i386 libxrandr-dev:i386 libxxf86vm-dev:i386 libasound2-dev:i386 libopenal-dev:i386
          python3 -m pip install meson==1.9.1

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head_commit }}
          submodules: recursive
          persist-credentials: false

      - name: Fetch pinned FontStash, minimp3 and Dear ImGui sources
        run: meson subprojects download fontstash minimp3 imgui

      - name: Build
        run: |
          make install -j$(nproc) ARCH=x86 COMPILE_ARCH=x86 CC=gcc DESTDIR=bin USE_SDL=0 USE_RENDERER_DLOPEN=1 USE_GLX=1 USE_VK=1 USE_RTX=1

      - name: Check glibc baseline
        run: python3 scripts/check_elf_glibc.py --max-glibc "$FNQL_LINUX_GLIBC_MAX" --require-elf bin

      - name: Verify release layout
        run: python3 scripts/verify_release_layout.py bin/fntech3-pkg.fnz

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86
          path: bin
          if-no-files-found: error
          retention-days: 5

  push-build-validation:
    if: always()
    needs: [prepare, windows-msys32, windows-msvc, source-validation, linux-x86-regression, ubuntu-x86]
    runs-on: ubuntu-latest
    steps:
      - name: Check platform build results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: data["result"]
              for name, data in needs.items()
              if data["result"] != "success"
          }

          if failed:
              for name, result in failed.items():
                  print(f"{name}: {result}")
              sys.exit(1)

          print("All platform build validations passed.")
          PY

  publish:
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        needs.prepare.result == 'success' &&
        needs.push-build-validation.result == 'success'
      }}
    needs: [prepare, push-build-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.head_commit }}
      RELEASE_DATE: ${{ needs.prepare.outputs.build_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download MinGW artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-mingw-x86
          path: artifacts/windows-mingw-x86

      - name: Download MSVC artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-msvc-x86
          path: artifacts/windows-msvc-x86

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x86
          path: artifacts/linux-x86

      - name: Package development prerelease
        run: |
          python scripts/release.py --channel candidate --artifact-root artifacts \
            --ref-name "$RELEASE_TAG" --build-date "$RELEASE_DATE" --commit "$SOURCE_COMMIT"

      - name: Render reviewed release notes
        run: |
          python scripts/release_workflow.py notes --tag "$RELEASE_TAG" --output .tmp/release-notes.md

      - name: Retain release bundle for review
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.release_tag }}
          path: |
            .install/packages/
            .install/release-manifest.json
            .install/SHA256SUMS.txt
            .tmp/release-notes.md
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Create or repair draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_workflow.py draft --tag "$RELEASE_TAG" \
            --manifest .install/release-manifest.json --notes .tmp/release-notes.md
          echo "Draft $RELEASE_TAG is ready for manual review in the repository Releases page." >> "$GITHUB_STEP_SUMMARY"
          echo 'Publication is a separate manual action. Retain the prerelease flag while compatibility gates remain open.' >> "$GITHUB_STEP_SUMMARY"
